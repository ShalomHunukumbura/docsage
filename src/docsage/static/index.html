<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocSage</title>
<style>
	:root {
		--bg: #f7f7f8;
		--card: #ffffff;
		--ink: #1a1a1c;
		--muted: #6b6b73;
		--line: #e3e3e8;
		--accent: #2f6fd0;
		--accent-soft: #e8f0fc;
		--good: #1f9254;
		--warn: #b5701a;
		--weak: #b03030;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #16161a;
			--card: #1e1e24;
			--ink: #ececf1;
			--muted: #9a9aa5;
			--line: #2e2e38;
			--accent: #6ea8ff;
			--accent-soft: #1f2a3d;
			--good: #4ec98a;
			--warn: #e0a955;
			--weak: #ef7676;
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: var(--bg);
		color: var(--ink);
		font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	}
	a { color: var(--accent); text-decoration: none; }
	a:hover { text-decoration: underline; }
	.wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
	header { margin-bottom: 24px; }
	h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.2px; }
	.sub { color: var(--muted); font-size: 14px; }
	.stats { color: var(--muted); font-size: 12.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
	.box {
		background: var(--card);
		border: 1px solid var(--line);
		border-radius: 12px;
		padding: 18px;
		margin-bottom: 18px;
	}
	textarea {
		width: 100%;
		border: 1px solid var(--line);
		border-radius: 9px;
		padding: 12px 14px;
		font: inherit;
		background: var(--bg);
		color: var(--ink);
		resize: vertical;
		min-height: 74px;
	}
	textarea:focus, select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
	.row {
		display: flex;
		gap: 12px;
		align-items: center;
		flex-wrap: wrap;
		margin-top: 12px;
	}
	button {
		background: var(--accent);
		color: #fff;
		border: 0;
		border-radius: 9px;
		padding: 10px 20px;
		font: inherit;
		font-weight: 550;
		cursor: pointer;
	}
	button:hover { filter: brightness(1.08); }
	button:disabled { opacity: .55; cursor: default; }
	button.ghost {
		background: transparent;
		color: var(--accent);
		border: 1px solid var(--line);
	}
	label { color: var(--muted); font-size: 13px; }
	input[type=number], select {
		padding: 7px 9px;
		border: 1px solid var(--line);
		border-radius: 7px;
		background: var(--bg);
		color: var(--ink);
		font: inherit;
		font-size: 14px;
	}
	input[type=number] { width: 58px; }
	.examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
	.chip {
		font: inherit;
		font-size: 13px;
		padding: 6px 11px;
		border: 1px solid var(--line);
		border-radius: 20px;
		background: var(--bg);
		color: var(--muted);
		cursor: pointer;
		font-weight: 400;
	}
	.chip:hover { border-color: var(--accent); color: var(--accent); filter: none; }
	h2 {
		font-size: 12px;
		text-transform: uppercase;
		letter-spacing: .8px;
		color: var(--muted);
		margin: 0 0 12px;
		font-weight: 600;
	}
	#answer { white-space: pre-wrap; }
	#answer.abstained { color: var(--muted); font-style: italic; }
	.cite {
		display: inline-block;
		min-width: 18px;
		padding: 0 4px;
		margin: 0 1px;
		border-radius: 4px;
		background: var(--accent-soft);
		color: var(--accent);
		font-size: 11.5px;
		font-weight: 600;
		line-height: 17px;
		text-align: center;
		vertical-align: 1px;
		font-style: normal;
	}
	.chunk {
		border-top: 1px solid var(--line);
		padding: 14px 0;
		scroll-margin-top: 16px;
	}
	.chunk:first-of-type { border-top: 0; padding-top: 0; }
	.chunk.flash { animation: flash 1.2s ease-out; }
	@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
	.chead {
		display: flex;
		justify-content: space-between;
		align-items: baseline;
		gap: 12px;
	}
	.src { font-weight: 600; font-size: 14px; min-width: 0; }
	.num { color: var(--muted); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
	.sect { color: var(--muted); font-size: 13px; margin: 1px 0 6px; overflow-wrap: anywhere; }
	.tag {
		font-size: 11px;
		font-weight: 600;
		letter-spacing: .3px;
		text-transform: uppercase;
		color: var(--good);
		margin-left: 8px;
	}
	.score { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; white-space: nowrap; }
	.s-good { color: var(--good); }
	.s-mid  { color: var(--warn); }
	.s-low  { color: var(--weak); }
	.ctext { color: var(--muted); font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
	details summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 4px; }
	.bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 8px; overflow: hidden; }
	.bar > i { display: block; height: 100%; background: currentColor; }
	.hint {
		font-size: 13px;
		color: var(--muted);
		border-left: 2px solid var(--line);
		padding-left: 12px;
		margin-top: 14px;
	}
	.err { color: var(--weak); font-size: 14px; }
	.spin {
		display: inline-block; width: 13px; height: 13px;
		border: 2px solid var(--line); border-top-color: var(--accent);
		border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px;
	}
	@keyframes sp { to { transform: rotate(360deg); } }
	.kb h3 { font-size: 14px; margin: 14px 0 4px; }
	.kb h3:first-of-type { margin-top: 0; }
	.kb ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
	.kb .lic { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 6px; }
	footer { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 28px; }
	[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

	<header>
		<h1>DocSage</h1>
		<div class="sub">Ask a software engineering question. Answers come only from the knowledge base, with every claim cited.</div>
		<div class="stats" id="stats"></div>
	</header>

	<div class="box">
		<textarea id="q" placeholder="e.g. How should an app store its configuration?" maxlength="500"></textarea>
		<div class="row">
			<button id="ask">Ask</button>
			<button id="search" class="ghost">Search only</button>
			<label>mode
				<select id="mode">
					<option value="hybrid">hybrid</option>
					<option value="dense">dense</option>
					<option value="keyword">keyword</option>
				</select>
			</label>
			<label>top_k <input type="number" id="k" value="5" min="1" max="10"></label>
			<span id="status" class="sub"></span>
		</div>
		<div class="examples">
			<button class="chip">How should an app store its configuration?</button>
			<button class="chip">How do I prevent SQL injection?</button>
			<button class="chip">When should I bump the major version?</button>
			<button class="chip">How fast should code reviews be?</button>
			<button class="chip">What is SSRF?</button>
			<button class="chip">What is the best pizza recipe?</button>
		</div>
	</div>

	<div class="box" id="answerBox" hidden>
		<h2>Answer</h2>
		<div id="answer"></div>
	</div>

	<div class="box" id="chunkBox" hidden>
		<h2 id="chunkTitle">Sources</h2>
		<div id="chunks"></div>
		<div class="hint" id="hint"></div>
	</div>

	<details class="box kb">
		<summary><h2 style="display:inline">What's in the knowledge base</h2></summary>
		<div id="kb" style="margin-top:14px"></div>
	</details>

	<footer>DocSage · hybrid retrieval (FAISS + BM25) · <a href="/docs">API docs</a></footer>
</div>

<script>
const $ = id => document.getElementById(id);
let threshold = 0.35;
let hasLLM = true;

// Corpus text includes HTML examples (e.g. OWASP), so never insert it raw.
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

function scoreClass(s) {
	if (s >= threshold + 0.15) return 's-good';
	if (s >= threshold) return 's-mid';
	return 's-low';
}

function renderSources(items, isAnswer) {
	$('chunkTitle').textContent = isAnswer ? 'Sources' : 'Retrieved chunks';
	$('chunks').innerHTML = items.map((c, i) => {
		const n = c.number ?? i + 1;
		const cls = scoreClass(c.similarity);
		const pct = Math.max(0, Math.min(100, c.similarity * 100));
		const short = c.text.length > 280;
		return `<div class="chunk" id="src-${n}">
			<div class="chead">
				<span class="src"><span class="num">${n}</span><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>${c.cited ? '<span class="tag">cited</span>' : ''}</span>
				<span class="score ${cls}" title="cosine similarity to the question">${c.similarity.toFixed(3)}</span>
			</div>
			<div class="sect">${esc(c.collection)}${c.section ? ' · ' + esc(c.section) : ''}</div>
			${short
				? `<details><summary>${esc(c.text.slice(0, 280))}…</summary><div class="ctext">${esc(c.text)}</div></details>`
				: `<div class="ctext">${esc(c.text)}</div>`}
			<div class="bar ${cls}"><i style="width:${pct}%"></i></div>
		</div>`;
	}).join('');
	$('chunkBox').hidden = false;
}

function renderHint(best) {
	$('hint').textContent = best >= threshold
		? `Closest match ${best.toFixed(3)}, above the ${threshold} threshold: the knowledge base covers this.`
		: `Closest match ${best.toFixed(3)}, below the ${threshold} threshold. Retrieval always returns something; the similarity is the only signal that none of it is relevant, so DocSage refuses to answer.`;
}

function renderAnswer(data) {
	const box = $('answer');
	box.className = data.abstained ? 'abstained' : '';
	// Escape first, then turn [n] into links to the matching source.
	box.innerHTML = esc(data.answer).replace(/\[(\d+)\]/g,
		(m, n) => `<a class="cite" href="#src-${n}" data-n="${n}">${n}</a>`);
	$('answerBox').hidden = false;
}

async function post(path, body) {
	const res = await fetch(path, {
		method: 'POST',
		headers: {'Content-Type': 'application/json'},
		body: JSON.stringify(body),
	});
	const data = await res.json();
	if (!res.ok) {
		const detail = Array.isArray(data.detail) ? data.detail.map(d => d.msg).join('; ') : data.detail;
		throw new Error(detail || ('HTTP ' + res.status));
	}
	return data;
}

async function run(kind) {
	const q = $('q').value.trim();
	if (!q) return;

	$('ask').disabled = $('search').disabled = true;
	$('status').innerHTML = '<span class="spin"></span>';
	$('answerBox').hidden = true;

	try {
		const k = +$('k').value;
		if (kind === 'ask') {
			const data = await post('/api/ask', {question: q, top_k: k});
			renderAnswer(data);
			renderSources(data.sources, true);
			renderHint(data.best_similarity);
		} else {
			const data = await post('/api/search', {query: q, top_k: k, mode: $('mode').value});
			renderSources(data.hits, false);
			renderHint(data.best_similarity);
		}
		$('status').textContent = '';
	} catch (e) {
		$('status').innerHTML = '<span class="err">' + esc(e.message) + '</span>';
	} finally {
		$('search').disabled = false;
		$('ask').disabled = !hasLLM;
	}
}

async function loadInfo() {
	try {
		const health = await (await fetch('/health')).json();
		threshold = health.min_similarity;
		$('stats').textContent = `${health.documents} documents · ${health.chunks} chunks · `
			+ (health.llm ? `answers by ${health.llm}` : 'no LLM configured: search only');
		hasLLM = !!health.llm;
		$('ask').disabled = !hasLLM;

		const docs = await (await fetch('/api/documents')).json();
		const groups = {};
		for (const d of docs) (groups[d.collection] ??= []).push(d);
		$('kb').innerHTML = Object.entries(groups).map(([name, items]) =>
			`<h3>${esc(name)}<span class="lic">${esc(items[0].license)}</span></h3><ul>`
			+ items.map(d => `<li><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a></li>`).join('')
			+ '</ul>').join('');
	} catch (e) { /* the page still works without stats */ }
}

$('ask').onclick = () => run('ask');
$('search').onclick = () => run('search');
$('q').addEventListener('keydown', e => {
	if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run(hasLLM ? 'ask' : 'search');
});
document.querySelectorAll('.chip').forEach(c => {
	c.onclick = () => { $('q').value = c.textContent; run(hasLLM ? 'ask' : 'search'); };
});
$('answer').addEventListener('click', e => {
	const a = e.target.closest('.cite');
	if (!a) return;
	const el = $('src-' + a.dataset.n);
	if (!el) return;
	el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
});
loadInfo();
</script>
</body>
</html>
