[project]
name = "docsage"
version = "0.2.0"
description = "Retrieval-augmented question answering over a software engineering knowledge base, with hybrid search, citations and evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Shalom Hunukumbura" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "sentence-transformers>=6.0",
    "torch>=2.3",
]

[project.scripts]
docsage = "docsage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# CPU-only torch: the GPU build is several GB and buys nothing for a corpus this size.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["W191", "E101"]  # tabs are the project's indentation
